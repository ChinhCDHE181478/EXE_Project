  backend:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app        # mount toàn bộ backend
      - ~/.m2:/root/.m2       # cache Maven local để build nhanh hơn
    command: ["mvn", "spring-boot:run"]
    ports:
      - "8087:8087"
    # depends_on:
    #   - mysql
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend-dev
    ports:
      - "3007:3007"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - ./frontend:/app         
      - /app/node_modules 

  redis:
    image: redis:8.2.1-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
