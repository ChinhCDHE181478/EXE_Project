# ================================================================
# NGINX REVERSE PROXY - PRODUCTION CONFIGURATION
# ================================================================
# Proxy requests đến backend, frontend, agents services
# Hỗ trợ SSL/HTTPS qua Let's Encrypt
# 
# ⚠️ THAY YOUR_DOMAIN_HERE bằng domain thật của bạn
# ================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # ================================================================
    # HTTP -> HTTPS REDIRECT
    # ================================================================
    server {
        listen 80;
        server_name YOUR_DOMAIN_HERE;  # ⚠️ THAY ĐỔI NÀY

        # Cho phép Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect tất cả HTTP -> HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ================================================================
    # HTTPS SERVER
    # ================================================================
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN_HERE;  # ⚠️ THAY ĐỔI NÀY

        # ------------------
        # SSL Configuration
        # ------------------
        # ⚠️ Sau khi chạy certbot, uncomment các dòng sau:
        # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 10m;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ------------------
        # Security Headers
        # ------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ------------------
        # CORS Headers
        # ------------------
        add_header Access-Control-Allow-Origin "https://YOUR_DOMAIN_HERE" always;  # ⚠️ THAY ĐỔI NÀY
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ------------------
        # FRONTEND (Next.js)
        # ------------------
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Rate limiting
            limit_req zone=general_limit burst=50 nodelay;
        }

        # ------------------
        # BACKEND API
        # ------------------
        location /api/v1/ {
            proxy_pass http://backend:8080/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting cho API
            limit_req zone=api_limit burst=20 nodelay;

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ------------------
        # AGENTS API
        # ------------------
        location /agents/ {
            proxy_pass http://agents:4000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Timeout cho AI requests (lâu hơn)
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Support cho streaming responses
            proxy_buffering off;
            proxy_cache off;
        }

        # ------------------
        # PAYOS WEBHOOK
        # ------------------
        # PayOS sẽ gọi webhook này
        location /api/v1/payments/payos/callback {
            proxy_pass http://backend:8080/api/v1/payments/payos/callback;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Không rate limit cho webhook
            # PayOS cần call được mọi lúc
        }

        # ------------------
        # HEALTH CHECKS
        # ------------------
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
